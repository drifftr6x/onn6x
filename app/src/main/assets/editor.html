<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher editor</title>
<style>
  :root { --bg:#0e1118; --bg2:#141824; --card:#171c29; --line:#262d40; --text:#eef1f7; --dim:#8c95ab; --accent:#5aa2ff; --accent2:#7c6cff; --bad:#ff6b6b; --good:#4cd08a; --warn:#f5b84b; --r:14px; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f2f4f9; --bg2:#e9edf5; --card:#ffffff; --line:#dbe0ec; --text:#161a24; --dim:#5d667a; --accent:#1769e0; --accent2:#5b4bd6; --bad:#c62828; --good:#1b8a4e; --warn:#b36b00; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:12px 16px 0; }
  .top { display:flex; align-items:center; gap:10px; max-width:760px; margin:0 auto 10px; }
  h1 { font-size:19px; margin:0; flex:1; letter-spacing:.2px; }
  h1 b { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:13px; padding:4px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--dim); }
  .pill i { width:8px; height:8px; border-radius:50%; background:var(--good); display:inline-block; }
  .pill.off i { background:var(--bad); animation:blink 1s infinite; }
  .pill.off { color:var(--bad); border-color:var(--bad); }
  .pill.warn i { background:var(--warn); }
  @keyframes blink { 50% { opacity:.25; } }
  nav { display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; max-width:760px; margin:0 auto; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex:none; border-radius:999px; padding:6px 16px; min-height:36px; background:transparent; border-color:transparent; color:var(--dim); }
  nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { padding:16px 16px 90px; max-width:760px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.15); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; min-width:0; }
  .dim { color:var(--dim); font-size:14px; }
  button, select, input { font:inherit; color:var(--text); background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-height:42px; }
  input:focus, select:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  input[type=text], input[type=password], input[type=search], input:not([type]) { width:100%; }
  select { max-width:100%; }
  button { cursor:pointer; transition:transform .06s, background .15s; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff; font-weight:600; }
  button.danger { color:var(--bad); }
  button.small { min-height:32px; padding:3px 10px; font-size:14px; }
  .chip { display:inline-flex; align-items:center; gap:2px; background:var(--bg2); border:1px solid var(--line); border-radius:999px; padding:2px 4px 2px 6px; margin:3px 4px 3px 0; }
  .chip img { width:22px; height:22px; border-radius:6px; margin-right:4px; }
  .chip button { min-height:30px; padding:2px 8px; border:none; background:none; }
  .msg { position:fixed; left:16px; right:16px; bottom:16px; padding:12px 16px; border-radius:12px; background:var(--card); border:1px solid var(--line); z-index:9; max-width:728px; margin:0 auto; box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .msg.bad { border-color:var(--bad); } .msg.good { border-color:var(--good); }
  label.field { display:block; margin:10px 0; }
  label.field span { display:block; color:var(--dim); font-size:14px; margin-bottom:3px; }
  h2 { font-size:16px; margin:0 0 8px; }
  #login { max-width:360px; margin:15vh auto; padding:18px; }
  .appicon { width:44px; height:44px; border-radius:11px; background:var(--bg2); object-fit:cover; flex:none; }
  .drop { border:2px dashed var(--line); border-radius:var(--r); padding:22px 14px; text-align:center; color:var(--dim); transition:border-color .15s, background .15s; }
  .drop.over { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,transparent); color:var(--text); }
  .drop button { margin-top:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:12px; }
  .thumb { position:relative; border-radius:12px; overflow:hidden; background:var(--bg2); border:1px solid var(--line); aspect-ratio:16/9; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .cap { position:absolute; left:0; right:0; bottom:0; padding:14px 8px 5px; font-size:12px; color:#fff; background:linear-gradient(transparent,rgba(0,0,0,.72)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .thumb button { position:absolute; top:6px; right:6px; min-height:30px; width:30px; padding:0; border-radius:50%; background:rgba(0,0,0,.6); border:none; color:#fff; }
  .up { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
  .up:first-child { border-top:none; }
  .bar { height:6px; border-radius:3px; background:var(--bg2); overflow:hidden; margin-top:5px; }
  .bar div { height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .15s; }
  .up.err .bar div { background:var(--bad); } .up.dup .bar div { background:var(--warn); } .up.done .bar div { background:var(--good); }
  .filerow { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
</style>
</head>
<body>
<div id="login" class="card" hidden>
  <h1>Launcher editor</h1>
  <p class="dim">Enter the 6-digit PIN shown on the TV.</p>
  <input id="pin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="PIN">
  <p><button class="primary" id="go">Connect</button></p>
  <p id="loginerr" class="dim"></p>
</div>
<div id="app" hidden>
  <header>
    <div class="top"><h1><b>onn6x</b> editor</h1><span id="pill" class="pill"><i></i><span id="pilltxt">Connected</span></span></div>
    <nav id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>
<div id="msg" class="msg" hidden></div>

<script>
"use strict";
var pin = "";
try { pin = sessionStorage.getItem("pin") || ""; } catch (e) {}
var S = null;
var tab = "rows";
var filter = "";
var TABS = [["rows","Rows"],["apps","Apps"],["look","Look"],["home","Smart home"],["files","Files"],["backup","Backup"]];

function h(tag, attrs) {
  var el = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    if (k === "onclick" || k === "onchange" || k === "oninput") el[k] = attrs[k];
    else if (k === "class") el.className = attrs[k];
    else if (attrs[k] === true) el.setAttribute(k, "");
    else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c == null || c === false) continue;
    el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  return el;
}

var msgTimer = null;
function toast(text, kind) {
  var m = document.getElementById("msg");
  m.textContent = text;
  m.className = "msg " + (kind || "");
  m.hidden = false;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(function () { m.hidden = true; }, 4000);
}

function api(path, body, raw) {
  var opts = { method: body === undefined ? "GET" : "POST", headers: { "X-Pin": pin } };
  if (body !== undefined) opts.body = raw ? body : JSON.stringify(body);
  return fetch(path, opts).catch(function () { throw new Error("Can't reach the TV. Check it is on and on the same Wi-Fi."); }).then(function (r) {
    return r.text().then(function (t) {
      var data = null;
      try { data = JSON.parse(t); } catch (e) {}
      if (r.status === 401) { showLogin("Wrong PIN."); throw new Error("Wrong PIN"); }
      if (!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
      return data;
    });
  });
}

function upload(path, file, onProgress) {
  return new Promise(function (resolve, reject) {
    var x = new XMLHttpRequest();
    x.open("POST", path);
    x.setRequestHeader("X-Pin", pin);
    x.upload.onprogress = function (e) { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    x.onload = function () {
      if (x.status >= 200 && x.status < 300) { resolve(); return; }
      var msg = "HTTP " + x.status;
      try { msg = JSON.parse(x.responseText).error || msg; } catch (e) {}
      reject(new Error(msg));
    };
    x.onerror = function () { reject(new Error("Connection lost")); };
    x.send(file);
  });
}

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function plain(method, url, body, timeout) {
  return new Promise(function (resolve, reject) {
    var x = new XMLHttpRequest();
    x.open(method, url);
    x.setRequestHeader("X-Pin", pin);
    x.timeout = timeout || 30000;
    x.onload = function () {
      var d = null;
      try { d = JSON.parse(x.responseText); } catch (e) {}
      resolve({ status: x.status, data: d });
    };
    x.onerror = function () { reject(new Error("Connection lost")); };
    x.ontimeout = function () { reject(new Error("Timed out")); };
    x.send(body === undefined ? null : body);
  });
}

// Sends a file in pieces. If the link drops, waits, asks the TV how much it already has, and carries on from there.
var CHUNK = 1024 * 1024;
function uploadFile(kind, file, onProgress, shouldCancel, onResult) {
  var base = "/api/upload?kind=" + kind + "&name=" + encodeURIComponent(file.name) + "&total=" + file.size;
  function probe() {
    return plain("POST", base + "&probe=1", "", 8000).then(function (r) {
      if (r.status === 401) throw new Error("Wrong PIN");
      if (r.status >= 400) throw new Error((r.data && r.data.error) || "HTTP " + r.status);
      return r.data.have || 0;
    });
  }
  function step(offset, fails) {
    if (shouldCancel && shouldCancel()) return Promise.reject(new Error("Cancelled"));
    if (offset >= file.size) return Promise.resolve();
    var end = Math.min(offset + CHUNK, file.size);
    return plain("POST", base + "&offset=" + offset, file.slice(offset, end), 60000).then(function (r) {
      if (r.status === 409 && r.data) { return step(r.data.have || 0, fails); }
      if (r.status === 401) throw new Error("Wrong PIN");
      if (r.status >= 400) throw new Error((r.data && r.data.error) || "HTTP " + r.status);
      if (onProgress) onProgress(end / file.size);
      if (r.data && r.data.duplicateOf && onResult) onResult(r.data);
      return step(end, 0);
    }, function (err) {
      if (fails >= 40) throw new Error("Gave up after the connection kept dropping");
      var wait = Math.min(1000 * Math.pow(1.6, fails), 8000);
      if (onProgress) onProgress(null, "Reconnecting...");
      return sleep(wait).then(probe).then(function (have) {
        return step(have, fails + 1);
      }, function () { return step(offset, fails + 1); });
    });
  }
  if (file.size === 0) return Promise.reject(new Error("That file is empty"));
  return probe().catch(function () { return 0; }).then(function (have) {
    // A leftover partial file from an earlier try can be resumed only if it is a prefix we sent; start fresh unless the TV asks us to resync.
    return step(0, 0);
  });
}

function act(promise, okText) {
  return promise.then(function (d) { if (okText) toast(okText, "good"); return load(); })
    .catch(function (e) { toast(e.message, "bad"); });
}

function showLogin(err) {
  document.getElementById("app").hidden = true;
  document.getElementById("login").hidden = false;
  document.getElementById("loginerr").textContent = err || "";
}

function load() {
  return api("/api/state").then(function (d) {
    S = d;
    document.getElementById("login").hidden = true;
    document.getElementById("app").hidden = false;
    render();
  });
}

function label(pkg) {
  for (var i = 0; i < S.apps.length; i++) if (S.apps[i].pkg === pkg) return S.apps[i].custom || S.apps[i].label;
  return pkg;
}

function appSelect(selected, includeNone, noneText) {
  var sel = h("select", { class: "grow" });
  if (includeNone) sel.appendChild(h("option", { value: "" }, noneText || "None"));
  S.apps.forEach(function (a) {
    var o = h("option", { value: a.pkg }, a.custom || a.label);
    if (a.pkg === selected) o.selected = true;
    sel.appendChild(o);
  });
  return sel;
}

function optionSelect(values, names, current, onchange) {
  var sel = h("select", { onchange: function () { onchange(Number(sel.value)); } });
  values.forEach(function (v, i) {
    var o = h("option", { value: v }, names ? names[i] : String(v));
    if (v === current) o.selected = true;
    sel.appendChild(o);
  });
  return sel;
}

function render() {
  var tabs = document.getElementById("tabs");
  tabs.textContent = "";
  TABS.forEach(function (t) {
    tabs.appendChild(h("button", { class: t[0] === tab ? "active" : "", onclick: function () { tab = t[0]; render(); window.scrollTo(0, 0); } }, t[1]));
  });
  var view = document.getElementById("view");
  var y = window.scrollY;
  view.textContent = "";
  ({ rows: viewRows, apps: viewApps, look: viewLook, home: viewHome, files: viewFiles, backup: viewBackup })[tab](view);
  window.scrollTo(0, y);
}

// ---------- Rows ----------
function viewRows(v) {
  var add = h("input", { placeholder: "New row name" });
  v.appendChild(h("div", { class: "card row" }, h("div", { class: "grow" }, add),
    h("button", { class: "primary", onclick: function () { act(api("/api/rows/add", { name: add.value }), "Row added"); } }, "Add row")));

  S.rows.forEach(function (row, index) {
    var card = h("div", { class: "card" });
    card.appendChild(h("div", { class: "row" },
      h("h2", { class: "grow" }, row.name),
      h("button", { disabled: index === 0, onclick: function () { act(api("/api/rows/move", { name: row.name, delta: -1 })); } }, "↑"),
      h("button", { disabled: index === S.rows.length - 1, onclick: function () { act(api("/api/rows/move", { name: row.name, delta: 1 })); } }, "↓"),
      h("button", { onclick: function () {
        var n = prompt("Rename row", row.name);
        if (n) act(api("/api/rows/rename", { name: row.name, newName: n }));
      } }, "Rename"),
      h("button", { class: "danger", onclick: function () {
        if (confirm("Delete the row \"" + row.name + "\"? The apps stay installed.")) act(api("/api/rows/delete", { name: row.name }));
      } }, "Delete")));
    var chips = h("div");
    row.apps.forEach(function (pkg, i) {
      chips.appendChild(h("span", { class: "chip" }, h("img", { loading: "lazy", alt: "", src: "/api/icon?pkg=" + encodeURIComponent(pkg) + "&pin=" + encodeURIComponent(pin) }), label(pkg),
        h("button", { disabled: i === 0, onclick: function () { act(api("/api/rows/moveapp", { pkg: pkg, row: row.name, delta: -1 })); } }, "◀"),
        h("button", { disabled: i === row.apps.length - 1, onclick: function () { act(api("/api/rows/moveapp", { pkg: pkg, row: row.name, delta: 1 })); } }, "▶"),
        h("button", { class: "danger", onclick: function () { act(api("/api/rows/removeapp", { pkg: pkg, row: row.name })); } }, "✕")));
    });
    if (!row.apps.length) chips.appendChild(h("p", { class: "dim" }, "Empty row."));
    card.appendChild(chips);
    var sel = appSelect("", false);
    card.appendChild(h("div", { class: "row", style: "margin-top:8px" }, sel,
      h("button", { onclick: function () { act(api("/api/rows/addapp", { pkg: sel.value, row: row.name })); } }, "Add app")));
    v.appendChild(card);
  });
}

// ---------- Apps ----------
function viewApps(v) {
  var search = h("input", { type: "search", placeholder: "Search apps", value: filter });
  var list = h("div");
  function fill() {
    list.textContent = "";
    var q = filter.toLowerCase();
    S.apps.filter(function (a) { return !q || (a.label + " " + a.custom + " " + a.pkg).toLowerCase().indexOf(q) >= 0; })
      .forEach(function (a) { list.appendChild(appCard(a)); });
  }
  search.oninput = function () { filter = search.value; fill(); };
  v.appendChild(h("div", { class: "card" }, search));
  v.appendChild(list);
  fill();
}

function appCard(a) {
  var file = h("input", { type: "file", accept: "image/png,image/jpeg,image/webp", hidden: true });
  file.onchange = function () {
    var f = file.files[0];
    if (!f) return;
    var ext = (f.name.split(".").pop() || "").toLowerCase();
    act(upload("/api/app/image?pkg=" + encodeURIComponent(a.pkg) + "&ext=" + encodeURIComponent(ext), f), "Picture saved");
  };
  return h("div", { class: "card" },
    h("div", { class: "row", style: "flex-wrap:nowrap" },
      h("img", { class: "appicon", loading: "lazy", alt: "", src: "/api/icon?pkg=" + encodeURIComponent(a.pkg) + "&pin=" + encodeURIComponent(pin) }),
      h("div", { class: "grow" }, h("strong", null, a.custom || a.label), a.custom ? h("span", { class: "dim" }, "  (" + a.label + ")") : null,
        h("div", { class: "dim" }, a.pkg + (a.hidden ? " · hidden" : ""))),
      ),
    h("div", { class: "row", style: "margin-top:8px" },
      h("button", { onclick: function () {
        var n = prompt("Name on the TV (leave empty to reset)", a.custom || a.label);
        if (n !== null) act(api("/api/app/rename", { pkg: a.pkg, name: n }));
      } }, "Rename"),
      h("button", { onclick: function () { file.click(); } }, a.image ? "Change picture" : "Tile picture"),
      a.image ? h("button", { class: "danger", onclick: function () { act(api("/api/app/image/delete", { pkg: a.pkg })); } }, "Remove picture") : null,
      h("button", { onclick: function () { act(api("/api/app/hide", { pkg: a.pkg, hidden: !a.hidden })); } }, a.hidden ? "Unhide" : "Hide"),
      file));
}

// ---------- Look ----------
function viewLook(v) {
  var s = S.settings, o = S.options;
  function set(key) { return function (val) { var b = {}; b[key] = val; act(api("/api/settings", b)); }; }
  function field(name, control) { return h("label", { class: "field" }, h("span", null, name), control); }
  function toggle(name, key) {
    var c = h("input", { type: "checkbox", style: "min-height:auto;width:auto" });
    c.checked = !!s[key];
    c.onchange = function () { set(key)(c.checked); };
    return h("label", { class: "row", style: "margin:8px 0" }, c, name);
  }
  var card = h("div", { class: "card" },
    field("Tile size", optionSelect([0,1,2], o.tileSizes, s.tileSize, set("tileSize"))),
    field("Theme", optionSelect(o.themes.map(function (_, i) { return i; }), o.themes, s.themeIndex, set("themeIndex"))),
    toggle("Switch theme automatically at sunrise and sunset", "autoTheme"),
    field("Day theme", optionSelect(o.themes.map(function (_, i) { return i; }), o.themes, s.dayTheme, set("dayTheme"))),
    field("Night theme", optionSelect(o.themes.map(function (_, i) { return i; }), o.themes, s.nightTheme, set("nightTheme"))),
    field("Font", optionSelect(o.fonts.map(function (_, i) { return i; }), o.fonts, s.fontIndex, set("fontIndex"))),
    field("Tile corners", optionSelect([0,1,2,3], o.roundness, s.roundness, set("roundness"))),
    field("Accent colour", optionSelect(o.accents.map(function (_, i) { return i; }), o.accents, s.accentIndex, set("accentIndex"))),
    field("Wallpaper changes every (minutes)", optionSelect(o.wallpaperMinutes, null, s.wallpaperMinutes, set("wallpaperMinutes"))),
    field("Screensaver after (minutes, 0 = never)", optionSelect(o.idleMinutes, null, s.idleMinutes, set("idleMinutes"))),
    toggle("Show the Recent row", "showRecents"),
    toggle("Show weather", "showWeather"),
    toggle("Use Fahrenheit", "fahrenheit"),
    toggle("Cards layout: weather and markets side by side under the first row", "dashboard"),
    toggle("Show the Trending row (needs a TMDB key below)", "showTrending"),
    toggle("Show the hero banner (big rotating backdrop)", "showHero"),
    toggle("Full-screen hero (backdrop fills the whole screen)", "heroFull"),
    toggle("Screensaver shows movie and show backdrops (needs TMDB key)", "idleBackdrops"),
    field("Titles shown (My tastes needs the taste test on the TV)", optionSelect(o.titleModes.map(function (_, i) { return i; }), o.titleModes, s.titleMode, set("titleMode"))),
    field("Where-to-watch region", optionSelect(o.regions.map(function (_, i) { return i; }), o.regions, s.tmdbRegion, set("tmdbRegion"))),
    toggle("Show the forecast card (hours, 5 days, sunrise and sunset)", "showForecast"),
    toggle("Show the markets card (crypto prices)", "showCrypto"));
  v.appendChild(card);

  var tmdbKey = h("input", { type: "password", placeholder: S.tmdb && S.tmdb.hasKey ? "Key saved (type to replace)" : "Paste your TMDB API key" });
  v.appendChild(h("div", { class: "card" }, h("h2", null, "TMDB (trending movies and shows)"),
    h("p", { class: "dim" }, "Free key from themoviedb.org: Settings > API. Either the short API Key or the long Read Access Token works. It stays on the box and is not included in backups. This product uses the TMDB API but is not endorsed or certified by TMDB."),
    h("div", { class: "row" }, h("div", { class: "grow" }, tmdbKey),
      h("button", { onclick: function () { act(api("/api/tmdb", { key: tmdbKey.value }), "TMDB connected"); } }, "Save"))));

  var wp = S.wallpaperSource || {};
  var wpUrl = h("input", { placeholder: "http://nas:5005/photos/  or  https://nas/webdav/wallpapers/", value: wp.url || "" });
  var wpUser = h("input", { placeholder: "Username (optional)", value: wp.user || "", autocomplete: "off" });
  var wpPass = h("input", { type: "password", placeholder: wp.hasPass ? "Password saved (type to replace)" : "Password (optional)", autocomplete: "new-password" });
  var wpInsecure = h("input", { type: "checkbox", style: "min-height:auto;width:auto" });
  wpInsecure.checked = !!wp.insecure;
  function wpSave() {
    return api("/api/wallpapers/source", { url: wpUrl.value, user: wpUser.value, pass: wpPass.value, insecure: wpInsecure.checked });
  }
  v.appendChild(h("div", { class: "card" }, h("h2", null, "Wallpaper source (NAS or web folder)"),
    h("p", { class: "dim" }, "Pictures in this folder are copied to the box and rotate as wallpapers. Works with a WebDAV folder (Synology, QNAP, Nextcloud, TrueNAS), a plain web folder that lists its files, or one direct picture link. smb:// shares are not supported: share the folder over WebDAV or HTTP on the NAS. Only jpg, png and webp directly inside the folder are used. The password stays on the box and is not included in backups."),
    h("div", { class: "row" }, h("div", { class: "grow" }, wpUrl)),
    h("div", { class: "row" }, h("div", { class: "grow" }, wpUser), h("div", { class: "grow" }, wpPass)),
    h("label", { class: "row", style: "margin:8px 0" }, wpInsecure, "Accept a self-signed HTTPS certificate (only for a NAS you trust on your own network)"),
    h("div", { class: "row" },
      h("button", { onclick: function () { act(wpSave(), "Wallpaper source saved"); } }, "Save"),
      h("button", { onclick: function () {
        toast("Syncing...", "good");
        act(wpSave().then(function () { return api("/api/wallpapers/sync", {}); }).then(function (d) { toast(d.message, "good"); }), null);
      } }, "Save and sync now")),
    h("p", { class: "dim" }, wp.status ? "Last sync: " + wp.status : "Not synced yet. It also syncs by itself every few hours.")));

  var coins = h("input", { placeholder: "btc, eth, sol", value: s.cryptoCoins });
  v.appendChild(h("div", { class: "card" }, h("h2", null, "Markets coins"),
    h("p", { class: "dim" }, "Up to 6 coins, prices in US dollars from CoinGecko. Use short names like btc or the full CoinGecko id."),
    h("div", { class: "row" }, h("div", { class: "grow" }, coins),
      h("button", { onclick: function () { act(api("/api/settings", { cryptoCoins: coins.value }), "Coins saved"); } }, "Save"))));

  var city = h("input", { placeholder: "City, e.g. Austin", value: s.weatherName });
  v.appendChild(h("div", { class: "card" }, h("h2", null, "Weather location"),
    h("div", { class: "row" }, h("div", { class: "grow" }, city),
      h("button", { onclick: function () { act(api("/api/settings", { weatherCity: city.value }), "Weather location saved"); } }, "Save"))));

  var sel = appSelect(S.autostart.pkg, true, "Don't open anything");
  var delay = optionSelect(o.autoStartDelays, o.autoStartDelays.map(function (d) { return d + " s"; }), S.autostart.delay, function () {});
  v.appendChild(h("div", { class: "card" }, h("h2", null, "Open an app after the box starts"),
    h("p", { class: "dim" }, "Counts down on the TV after a reboot. Any button press cancels it."),
    field("App", sel), field("Wait before opening", delay),
    h("button", { class: "primary", onclick: function () { act(api("/api/autostart", { pkg: sel.value, delay: Number(delay.value) }), "Saved"); } }, "Save")));
}

// ---------- Smart home ----------
function viewHome(v) {
  var url = h("input", { placeholder: "http://192.168.1.10:8123", value: S.ha.url });
  var token = h("input", { type: "password", placeholder: S.ha.hasToken ? "Token saved (type to replace)" : "Long-lived access token" });
  v.appendChild(h("div", { class: "card" }, h("h2", null, "Home Assistant"),
    h("p", { class: "dim" }, "Plain http on your home network. The token stays on the box and is not included in backups."),
    h("label", { class: "field" }, h("span", null, "Address"), url),
    h("label", { class: "field" }, h("span", null, "Access token"), token),
    h("button", { class: "primary", onclick: function () {
      var b = { url: url.value };
      if (token.value) b.token = token.value;
      act(api("/api/ha/config", b), "Saved");
    } }, "Save")));

  S.tiles.forEach(function (t, i) {
    v.appendChild(h("div", { class: "card row" },
      h("div", { class: "grow" }, h("strong", null, t.label),
        h("div", { class: "dim" }, t.kind === "ha" ? (t.domain + "." + t.service + (t.entity ? " → " + t.entity : "")) : (t.method + " " + t.url))),
      h("button", { onclick: function () {
        api("/api/ha/test", { tile: t }).then(function (d) { toast(d.message, "good"); }).catch(function (e) { toast(e.message, "bad"); });
      } }, "Test"),
      h("button", { class: "danger", onclick: function () {
        var tiles = S.tiles.slice(); tiles.splice(i, 1);
        act(api("/api/ha/tiles", { tiles: tiles }));
      } }, "Delete")));
  });

  var f = {};
  function inp(name, ph) { f[name] = h("input", { placeholder: ph }); return h("label", { class: "field" }, h("span", null, name), f[name]); }
  var kind = h("select", null, h("option", { value: "ha" }, "Home Assistant service"), h("option", { value: "url" }, "Web address (webhook)"));
  var method = h("select", null, h("option", null, "POST"), h("option", null, "GET"), h("option", null, "PUT"));
  v.appendChild(h("div", { class: "card" }, h("h2", null, "Add a tile"),
    h("label", { class: "field" }, h("span", null, "Type"), kind),
    inp("Label", "Living room light"),
    inp("Domain", "light"), inp("Service", "toggle"), inp("Entity", "light.living_room"),
    inp("Extra JSON (optional)", "{\"brightness\": 120}"),
    inp("Web address", "https://..."),
    h("label", { class: "field" }, h("span", null, "Method (web address only)"), method),
    h("button", { class: "primary", onclick: function () {
      var tile = {
        id: "t" + Date.now(), label: f["Label"].value, kind: kind.value,
        domain: f["Domain"].value, service: f["Service"].value, entity: f["Entity"].value,
        data: f["Extra JSON (optional)"].value, url: f["Web address"].value, method: method.value
      };
      if (!tile.label.trim()) { toast("Give the tile a label", "bad"); return; }
      if (tile.kind === "ha" && (!tile.domain.trim() || !tile.service.trim())) {
        toast("Fill in Domain and Service (for example light and toggle). The grey text is only an example.", "bad"); return;
      }
      if (tile.kind === "url" && !/^https?:\/\//.test(tile.url.trim())) {
        toast("The web address must start with http:// or https://", "bad"); return;
      }
      act(api("/api/ha/tiles", { tiles: S.tiles.concat([tile]) }), "Tile added");
    } }, "Add tile")));
}

// ---------- Files ----------
function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }

var queue = [];   // upload items shared across tabs so a tab switch doesn't lose the tray
var running = false;
var onQueue = function () {};

function pump() {
  if (running) return;
  var next = queue.filter(function (q) { return q.state === "wait"; })[0];
  if (!next) return;
  running = true; next.state = "run"; onQueue();
  uploadFile(next.kind, next.file, function (p, text) {
    if (p != null) next.progress = p;
    next.note = text || "";
    onQueue();
  }, function () { return next.cancel; }, function (d) { next.dup = d.duplicateOf; }).then(function () {
    next.state = next.dup ? "dup" : "done"; next.progress = 1; next.note = next.dup ? "Already have this picture as " + next.dup + ", skipped" : "";
  }, function (e) {
    next.state = "err"; next.note = e.message;
  }).then(function () {
    running = false; onQueue();
    if (!queue.some(function (q) { return q.state === "wait" || q.state === "run"; })) {
      load().catch(function () {});
    }
    pump();
  });
}

function enqueue(kind, files) {
  Array.prototype.forEach.call(files, function (f) {
    var same = queue.some(function (q) { return q.state === "wait" && q.kind === kind && q.file.name === f.name && q.file.size === f.size; });
    if (same) return;
    queue.push({ kind: kind, file: f, state: "wait", progress: 0, note: "" });
  });
  onQueue(); pump();
}

function fileSection(title, hint, accept, kind, list, deletePath, thumbs) {
  var input = h("input", { type: "file", accept: accept, multiple: true, hidden: true });
  input.onchange = function () { enqueue(kind, input.files); input.value = ""; };
  var tray = h("div");
  var drop = h("div", { class: "drop" }, h("div", null, "Drag files here, or"),
    h("button", { class: "primary", onclick: function () { input.click(); } }, "Choose files"), input);
  ["dragenter", "dragover"].forEach(function (n) { drop.addEventListener(n, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (n) { drop.addEventListener(n, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function (e) { if (e.dataTransfer && e.dataTransfer.files.length) enqueue(kind, e.dataTransfer.files); });

  function paint() {
    tray.textContent = "";
    queue.filter(function (q) { return q.kind === kind; }).forEach(function (q) {
      var bar = h("div", { class: "bar" }, h("div", { style: "width:" + Math.round(q.progress * 100) + "%" }));
      var status = q.state === "wait" ? "Waiting" : q.state === "run" ? (q.note || Math.round(q.progress * 100) + "%") : q.state === "done" ? "Done" : q.note;
      tray.appendChild(h("div", { class: "up " + q.state },
        h("div", { class: "grow" }, h("div", null, q.file.name, h("span", { class: "dim" }, "  " + size(q.file.size))),
          bar, h("div", { class: "dim" }, status)),
        q.state === "err" ? h("button", { class: "small", onclick: function () { q.state = "wait"; q.progress = 0; q.note = ""; onQueue(); pump(); } }, "Retry") : null,
        q.state === "wait" || q.state === "err" ? h("button", { class: "small", onclick: function () { q.cancel = true; q.state = "gone"; queue.splice(queue.indexOf(q), 1); onQueue(); } }, "✕") : null));
    });
  }
  onQueue = function () { if (document.body.contains(tray)) paint(); };
  paint();

  var card = h("div", { class: "card" }, h("h2", null, title), h("p", { class: "dim" }, hint), drop, tray);
  if (thumbs && list.length) {
    var grid = h("div", { class: "grid" });
    list.forEach(function (f) {
      grid.appendChild(h("div", { class: "thumb" },
        h("img", { loading: "lazy", alt: f.name, src: "/api/wallpaper/thumb?name=" + encodeURIComponent(f.name) + "&pin=" + encodeURIComponent(pin) }),
        h("div", { class: "cap" }, f.name + " · " + size(f.size)),
        h("button", { title: "Delete", onclick: function () {
          if (confirm("Delete " + f.name + "?")) act(api(deletePath, { name: f.name }), "Deleted");
        } }, "✕")));
    });
    card.appendChild(grid);
  } else {
    list.forEach(function (f) {
      card.appendChild(h("div", { class: "filerow" },
        h("div", { class: "grow" }, f.name, h("span", { class: "dim" }, "  " + size(f.size))),
        h("button", { class: "danger small", onclick: function () {
          if (confirm("Delete " + f.name + "?")) act(api(deletePath, { name: f.name }), "Deleted");
        } }, "Delete")));
    });
  }
  if (!list.length) card.appendChild(h("p", { class: "dim" }, "Nothing here yet."));
  return card;
}

function viewFiles(v) {
  v.appendChild(fileSection("Wallpapers", "Pictures rotate on the home screen. 16:9 works best. Large uploads are sent in pieces and pick up where they left off if the Wi-Fi drops.", "image/*", "wallpaper", S.wallpapers, "/api/wallpaper/delete", true));
  v.appendChild(fileSection("APK installer", "Upload an app file, then on the TV open Settings → Install APKs.", ".apk", "apk", S.apks, "/api/apk/delete", false));

// ---------- Backup ----------
function viewBackup(v) {
  var input = h("input", { type: "file", accept: ".json,application/json", hidden: true });
  input.onchange = function () {
    var f = input.files[0];
    if (!f) return;
    if (!confirm("Replace the current layout and settings with this file?")) return;
    f.text().then(function (t) { return act(api("/api/restore", t, true), "Layout restored"); });
  };
  v.appendChild(h("div", { class: "card" }, h("h2", null, "Backup and restore"),
    h("p", { class: "dim" }, "Rows, hidden apps, names, settings and button mappings. The Home Assistant token is never included."),
    h("div", { class: "row" },
      h("button", { class: "primary", onclick: function () {
        fetch("/api/backup", { headers: { "X-Pin": pin } }).then(function (r) { return r.blob(); }).then(function (b) {
          var a = document.createElement("a");
          a.href = URL.createObjectURL(b); a.download = "launcher-layout.json"; a.click();
        });
      } }, "Download backup"),
      h("button", { onclick: function () { input.click(); } }, "Restore from file"), input)));
}

// ---------- connection watch ----------
var misses = 0;
function setPill(cls, text) {
  var p = document.getElementById("pill");
  p.className = "pill " + cls;
  document.getElementById("pilltxt").textContent = text;
}
function ping() {
  if (document.getElementById("app").hidden) return;
  plain("GET", "/api/ping", undefined, 4000).then(function (r) {
    if (r.status === 401) { showLogin("Wrong PIN."); return; }
    var back = misses > 0;
    misses = 0;
    var left = r.data && r.data.left;
    if (left != null && left < 300) {
      setPill("warn", "Closing in " + Math.max(1, Math.round(left / 60)) + " min · tap to keep open");
    } else {
      setPill("", "Connected");
    }
    if (back) { toast("Reconnected", "good"); load().catch(function () {}); }
  }, function () {
    misses++;
    if (misses >= 2) setPill("off", "Reconnecting...");
  });
}
document.getElementById("pill").onclick = function () {
  api("/api/extend", {}).then(function (d) { toast("Editor stays open for another " + Math.round(d.left / 60) + " min", "good"); ping(); }).catch(function (e) { toast(e.message, "bad"); });
};
setInterval(ping, 4000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) ping(); });
window.addEventListener("online", ping);

// ---------- start ----------
document.getElementById("go").onclick = function () {
  pin = document.getElementById("pin").value.trim();
  load().then(function () { try { sessionStorage.setItem("pin", pin); } catch (e) {} })
    .catch(function (e) { document.getElementById("loginerr").textContent = e.message; });
};
if (pin) { load().catch(function () { showLogin(""); }); } else { showLogin(""); }
</script>
